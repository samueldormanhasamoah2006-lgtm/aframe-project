<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Summer Terrace – A-Frame</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{overflow:hidden;background:#0d0d0d}

    /* bottom strip */
    #hud-bottom{
      position:fixed;bottom:24px;left:0;right:0;
      display:flex;justify-content:center;align-items:center;gap:28px;
      pointer-events:none;z-index:999;
    }
    .pip{
      display:flex;align-items:center;gap:8px;
      font-family:'Lato',sans-serif;font-weight:300;
      font-size:9px;letter-spacing:0.25em;text-transform:uppercase;
      color:rgba(255,230,140,0.5);
    }
    .pip-dot{
      width:5px;height:5px;border-radius:50%;
      background:rgba(255,210,80,0.55);
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    #hud-bottom{animation:fadeIn 2s ease 0.5s both}

    /* ── crosshair ── */
    #crosshair{
      position:fixed;top:50%;left:50%;
      transform:translate(-50%,-50%);
      z-index:998;pointer-events:none;
      width:16px;height:16px;
    }
    #crosshair::before,#crosshair::after{
      content:'';position:absolute;background:rgba(255,240,180,0.35);
    }
    #crosshair::before{width:1px;height:100%;left:50%;transform:translateX(-50%)}
    #crosshair::after{width:100%;height:1px;top:50%;transform:translateY(-50%)}
  </style>
</head>
<body>



<!-- ══════════════════════════════════════════════════════════════
     A-FRAME SCENE
     ══════════════════════════════════════════════════════════════ -->
<a-scene
  shadow="type:pcfsoft"
  renderer="antialias:true;colorManagement:true;physicallyCorrectLights:true;highRefreshDisplay:false"
  fog="type:exponential;color:#f5ddb0;density:0.012"
  vr-mode-ui="enabled:false">

  <!-- ════════════════════
       ASSETS / ANIMATIONS
       ════════════════════ -->
  <a-assets>
    <!-- Gentle sway animation for parasol -->
    <a-mixin id="sway"
      animation__sway="property:rotation;from:0 0 -0.8;to:0 0 0.8;
                        dir:alternate;loop:true;dur:3800;easing:easeInOutSine">
    </a-mixin>
    <!-- Slow drift for petals -->
    <a-mixin id="petal-drift"
      animation__fall="property:position;to:0 -0.5 0;dur:4000;loop:true;easing:linear"
      animation__sway="property:rotation;from:0 0 0;to:30 60 20;
                        dir:alternate;loop:true;dur:1800;easing:easeInOutSine">
    </a-mixin>
  </a-assets>


  <!-- ════════════════════
       GOLDEN-HOUR SKY
       ════════════════════ -->

  <!-- Deep sky zenith -->
  <a-sky color="#4a8fbf"></a-sky>

  <!-- Horizon glow layers -->
  <a-plane position="0 2.5 -45" rotation="0 0 0"
           width="150" height="22"
           color="#f5b060" opacity="0.55" transparent="true" roughness="1"></a-plane>
  <a-plane position="0 1.2 -45" rotation="0 0 0"
           width="150" height="12"
           color="#f08040" opacity="0.38" transparent="true" roughness="1"></a-plane>
  <a-plane position="0 5.5 -45" rotation="0 0 0"
           width="150" height="14"
           color="#fad090" opacity="0.28" transparent="true" roughness="1"></a-plane>

  <!-- Sun disc -->
  <a-sphere position="-18 8 -40" radius="1.6"
            color="#fff0a0"
            roughness="0" metalness="0"
            emissive="#ffe040" emissive-intensity="1.4">
  </a-sphere>
  <!-- Sun halo -->
  <a-sphere position="-18 8 -40" radius="2.8"
            color="#ffcc40"
            opacity="0.18" transparent="true"
            roughness="0" metalness="0">
  </a-sphere>
  <a-sphere position="-18 8 -40" radius="4.5"
            color="#ffa020"
            opacity="0.09" transparent="true"
            roughness="0" metalness="0">
  </a-sphere>

  <!-- Fluffy clouds -->
  <!-- Cloud A -->
  <a-sphere position="-22 12 -38" radius="3.5"   color="#fff9f0" roughness="1" opacity="0.82" transparent="true"></a-sphere>
  <a-sphere position="-18 11.5 -38" radius="4.2" color="#fff5e8" roughness="1" opacity="0.78" transparent="true"></a-sphere>
  <a-sphere position="-14 12.2 -38" radius="3.0" color="#fffaf2" roughness="1" opacity="0.75" transparent="true"></a-sphere>
  <a-sphere position="-19 9.5 -38" radius="2.8"  color="#fff2e0" roughness="1" opacity="0.6"  transparent="true"></a-sphere>

  <!-- Cloud B -->
  <a-sphere position="14 14 -38" radius="3.0"  color="#fff8f0" roughness="1" opacity="0.7" transparent="true"></a-sphere>
  <a-sphere position="18 13.5 -38" radius="4.0" color="#fff5ec" roughness="1" opacity="0.65" transparent="true"></a-sphere>
  <a-sphere position="22 14 -38" radius="2.6"  color="#fffaf2" roughness="1" opacity="0.65" transparent="true"></a-sphere>

  <!-- Cloud C (small, mid-right) -->
  <a-sphere position="8 17 -42" radius="2.2"  color="#fff8f0" roughness="1" opacity="0.55" transparent="true"></a-sphere>
  <a-sphere position="11 16.5 -42" radius="2.8" color="#fffaf2" roughness="1" opacity="0.5" transparent="true"></a-sphere>


  <!-- ════════════════════
       LIGHTING
       ════════════════════ -->

  <!-- Warm ambient -->
  <a-light type="ambient" color="#ffecc0" intensity="0.60"></a-light>

  <!-- Golden-hour sun (low, warm) -->
  <a-light type="directional"
           color="#ffdd80" intensity="2.2"
           position="-6 5 4"
           cast-shadow="true"
           shadow-map-width="4096" shadow-map-height="4096"
           shadow-camera-near="0.1"  shadow-camera-far="40"
           shadow-camera-left="-10" shadow-camera-right="10"
           shadow-camera-top="10"   shadow-camera-bottom="-10"
           shadow-bias="-0.0005">
  </a-light>

  <!-- Sky hemisphere bounce -->
  <a-light type="hemisphere"
           color="#c0d8f0" ground-color="#c8c490"
           intensity="0.45">
  </a-light>

  <!-- Warm fill under parasol -->
  <a-light type="point"
           color="#ffd060" intensity="0.9"
           position="0 2.4 0"
           distance="5" decay="2">
  </a-light>

  <!-- Soft pink bounce from flowers -->
  <a-light type="point"
           color="#ffb8a0" intensity="0.3"
           position="-4 1.2 -3"
           distance="4" decay="2">
  </a-light>
